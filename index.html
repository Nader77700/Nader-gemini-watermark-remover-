<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nader Akram – Watermark Remover</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .app {
      background: #161616;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h1 {
      margin-bottom: 5px;
    }
    p {
      opacity: 0.8;
      font-size: 14px;
    }
    input {
      margin-top: 20px;
      width: 100%;
    }
    canvas {
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background: #2ecc71;
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app">
  <h1>Nader Akram</h1>
  <p>Watermark Remover Tool</p>

  <input type="file" id="upload" accept="image/*"/>
  <canvas id="canvas"></canvas>

  <button id="download">Download Result</button>
</div>

<script src="watermark.js"></script>
</body>
</html>
